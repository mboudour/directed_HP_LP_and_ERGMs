# Dataset registry for the agreed directed HP/LP/ERGM paper.
# Raw and derived data are deliberately excluded from Git. This file records only paths,
# integrity expectations, and eligibility gates.

datasets:
  enron_20150507:
    status: main_native
    raw_input: data/external/enron_20150507/enron_mail_20150507.tar.gz
    address_provenance_layer: true
    primary_node_set: reviewed_custodian_mailboxes
    required_identity_map: data/processed/enron_20150507/custodian_address_map.csv
    core_rule: top_100_by_sent_plus_received_activity_within_primary_node_set
    native_event_policy: singleton_sender_to_plus_cc_recipients
    temporal_panels: calendar_month
    temporal_policy: configs/enron_temporal_policy.yaml
    timestamp_inclusion_utc:
      start: "1998-01-01T00:00:00+00:00"
      end: "2002-12-31T23:59:59.999999+00:00"
    static_targets: [arc, footprint, concept, native_event, role_assignment]
    hard_gate: reviewed_custodian_to_address_mapping_before_primary_projection
    gate_record: data/metadata/gates/enron_custodian_projection.json
    mcmle_feasibility_core:
      status: approved_after_core100_M2_and_M4_mcmle_nonmixing
      node_rule: nested_rank_1_through_50_subset_of_primary_core_100
      scope: mcmle_feasibility_and_joint_score_sensitivity_only
      primary_core100_results_unchanged: true

  email_eu_core_temporal:
    status: main_dyadic_temporal
    raw_input: data/raw/email_eu_core_temporal/email-Eu-core-temporal.txt
    expected_rows: 332334
    core_rule: top_100_by_sent_plus_received_activity
    temporal_panels:
      primary_days: 30
      sensitivity_days: [14, 28]
    static_targets: [arc, footprint, concept, dyadic_role_assignment]
    native_event_policy: unsupported_in_primary_analysis

  caviar:
    status: main_dyadic_static_full_only
    raw_input_glob: data/raw/caviar/csv_matrices/CAVIAR*.csv
    approved_matrix: data/raw/caviar/csv_matrices/CAVIAR_FULL.csv
    phases: 11
    core_rule: whole_network
    static_targets: [arc, footprint, concept, dyadic_role_assignment]
    native_event_policy: unsupported
    temporal_phase_policy: excluded_pending_source_correction_for_CAVIAR7_duplicate_label_9
    hard_gate: evidence_backed_caller_to_receiver_orientation_and_unique_full_matrix_labels
    gate_record: data/metadata/gates/caviar_direction.json

  ciel:
    status: blocked_pending_source_specific_direction_evidence
    raw_input: data/raw/ciel/csv_matrix/CSV/CIELNET.csv
    core_rule: whole_network
    static_targets: [arc, footprint, concept, dyadic_role_assignment]
    native_event_policy: unsupported
    hard_gate: source_specific_confirmation_that_rows_are_callers_and_columns_are_receivers
    gate_record: data/metadata/gates/ciel_direction.json

  jmail_v1_2026_02:
    status: conditional_native_pending_source_stream_entity_and_recipient_policy
    raw_input: data/raw/jmail_v1_2026_02/emails-slim.parquet
    expected_rows: 1781028
    core_rule: top_100_by_sent_plus_received_activity
    native_event_policy: singleton_sender_to_plus_cc_recipients_bcc_separate
    static_targets: [arc, footprint, concept, native_event, role_assignment]
    hard_gate: defensible_provenance_entity_resolution_licensing_and_derived_release
    gate_record: data/metadata/gates/jmail_v1_admissibility.json

  mathoverflow_stackexchange_2024:
    status: prepared_reconstructed_native_static_core
    raw_input: data/raw/mathoverflow_stackexchange_2024/Posts.xml
    optional_users_input: data/raw/mathoverflow_stackexchange_2024/Users.xml
    core_rule: top_100_by_sent_plus_received_activity
    native_event_policy: distinct_answerers_to_question_asker_within_declared_window
    static_targets: [arc, footprint, concept, conditional_native_event, role_assignment]
    hard_gate: fixed_answer_window_deleted_post_anonymous_user_and_duplicate_answerer_policy
    gate_record: data/metadata/gates/mathoverflow_reconstruction_policy.json
