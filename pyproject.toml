[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "directed-hp-lp-ergms"
version = "0.1.0"
description = "Directed link prediction, hyperlink prediction, and ERGM benchmarks under network missingness."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Moses Boudourides" }]
dependencies = [
  "duckdb>=1.1,<2",
  "hypernetx>=2.3,<3",
  "matplotlib>=3.9,<4",
  "networkx>=3.3,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<24",
  "pyyaml>=6.0,<7",
  "rich>=13,<15",
  "scikit-learn>=1.5,<2",
  "scipy>=1.14,<2",
  "seaborn>=0.13,<1",
  "statsmodels>=0.14,<1",
  "tqdm>=4.66,<5",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
neural = [
  "torch>=2.4,<3",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[project.scripts]
directed-hp = "directed_hp.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/directed_hp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["directed_hp"]
